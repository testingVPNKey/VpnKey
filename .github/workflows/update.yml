name: Update VPN subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate subscription
        run: python3 generate.py

      - name: Save updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.txt generation_report.json
          git diff --cached --quiet || git commit -m "Update VPN subscription"
          git push
